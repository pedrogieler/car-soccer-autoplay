name: Check simulation

on:
  push:
    paths:
      - "scripts/**"
      - "styles/**"
      - "tests/**"
      - "index.html"
      - ".github/workflows/check-game.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
